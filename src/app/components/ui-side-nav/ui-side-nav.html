<ul>
  @for(tab of tabs; track $index)
  {
    <li>
      <button
        ui-button-icon
        (click)="goTo(tab.name)"
        class="button-sidenav"
        [iconCode]="tab.iconCode"
        [iconColor]="getActiveTab(tab.name) ? 'blue' :'grey'"
        [ngClass]="{'button-sidenav-active': getActiveTab(tab.name)}"
        >
        {{tab.label}}
      </button>
    </li>
  }
</ul>
