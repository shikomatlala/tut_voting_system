<div class="section">
  <div ui-card-container>
    <table ui-table>
      <tr ui-table-row class="header">
        @for(column of productListService.getColumnTitles(); track column)
        {
          <td ui-table-data class="header">
            <button
              ui-button
              class="small-padding-and-margin table-button">
              @if(column.caption != "")
              {
                {{column.caption | uppercase}}
                <ui-icon color="grey" [code]="column.isSortAscending ? column.ascendingIcon: column.descendingIcon">

                </ui-icon>
              }
            </button>
          </td>
        }

      </tr>
    </table>
  </div>
</div>
