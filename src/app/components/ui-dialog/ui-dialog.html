
<div>
  <h2>{{uIDialogTitle()}}</h2>
  <p>{{uIDialogMessage()}}</p>
  <div class="flex-buttons">
    <button ui-button class="grey fill" style="width: calc(100% - 5px)" (click)="cancel()">Cancel</button>
    <button ui-button class="red fill"  style="width: calc(100% - 5px)" (click)="confirm()">Yes</button>
  </div>
</div>
