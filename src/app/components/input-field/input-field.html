@if(hasIcon())
{
  <ui-icon
    class="icon"
    [type]="iconType()"
    [code]="iconCode()"
  />
}
<ng-content></ng-content>
@if(isPasswordType())
{
  <button
    class="show-hide-password-button"
    [ngClass]="{
      'isShowPasswordButtonFocused()' : ''

    }"
    (click)="passwordControllor.toggleShowPassword()"
    (focus)="isShowPasswordButtonFocused.set(true)"
    (focusout)="isShowPasswordButtonFocused.set(false)"
    (focusout)="passwordControllor.hidePassword()"
    type="button">
    <ui-icon
      class="icon"
      [code]="passwordControllor.getIsShowPassword() ? 'visibility' : 'visibilityOff'"
      [type]="isShowPasswordButtonFocused() ? 'blue' : 'grey'"
      />

  </button>
}
