<section  class="page-section">
  <div ui-card class="header" name="heading">
    <ui-header/>
    <h1>Login</h1>
    <p>Login to cast your vote</p>
  </div>
<form
  ui-form
  #loginForm="ngForm"
  (ngSubmit)="onSubmit(loginForm)" >
  <div
    ui-input-field
    iconCode="person"
    [iconType]="isStudentNumberInputSelected() ? 'blue': 'grey'"
    [hasIcon]="true" >
    <input
      ngModel
      (focus)="isStudentNumberInputSelected.set(true)"
      (focusout)="isStudentNumberInputSelected.set(false)"
      name="username"
      #username="ngModel"
      id="username"
      pattern="[0-9]{6,9}"
      type="text"
      placeholder="Student Number"
      required>
  </div>
  <div
    ui-input-field
    iconCode="lock"
    [isPasswordType]="true"
    [iconType]="isPasswordInputSelected()? 'blue': 'grey'"
    [hasIcon]="true" >
      <input
        (focus)="isPasswordInputSelected.set(true)"
        (focusout)="isPasswordInputSelected.set(false)"
        ngModel
        minlength="6"
        aria-describedby="passwordrules"
        name="password"
        #password="ngModel"
        id="password"
        [type]="passwordController.getIsShowPassword() ? 'text' : 'password'"
        placeholder="Password"
        required>
  </div>
  <button
    ui-button
    class="width-200px"
    [ngClass]="{'disabled' : !loginForm.valid}"
    /* [disabled]="!loginForm.valid" */
    (click)=" !loginForm.valid ? showError(loginForm) : ''"
    type="submit"
    >
    Login
  </button>
</form>
<ul>
  <li>
    <a routerLink="../forgot-password">Forgot Password?</a>
  </li>
</ul>
</section>
