<section class="page-section">
  <div ui-card class="header" name="heading">
    <ui-header/>
    <h1>Recover Password</h1>
    <p>Enter your student number to recover your password</p>
  </div>
  <form
    ui-form
    #forgotPasswordForm="ngForm"
    (ngSubmit)="onSubmit(forgotPasswordForm)"
    >
    <div
      ui-input-field
      iconCode="person"
      [iconType]="isStudentNumberInputSelected()? 'blue': 'grey'"
      [hasIcon]="true"
    >
      <input
        ngModel
        name="username"
        #username="ngModel"
        id="username"
        pattern="[0-9]{6,9}"
        type="text"
        placeholder="Student Number"
        required>
    </div>
    <button
      ui-button
      class="width-200px"
      [ngClass]="{'disabled' : !forgotPasswordForm.valid}"
      (click)=" !forgotPasswordForm.valid ? showError(forgotPasswordForm) : ''"
      /* [disabled]="!forgotPasswordForm.valid"*/
      NgClass
      type="submit"
      >
      Submit
    </button>
  </form>
  <ul>
    <li>
      <a routerLink="../login">Login</a>
    </li>
  </ul>
</section>
